<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Unit teszt feladat</title>
	<script type="text/javascript">
	function kivalogatParosOtven(tomb) {
    var eredmeny = [];
    for (var i = 0; i < tomb.length; i++) {
        if (tomb[i] > 50 && tomb[i] % 2 == 0) {
            eredmeny.push(tomb[i]);
        }
    }
    return eredmeny;
	}

	function aBetukSzamaDiv() {
    var szoveg = document.getElementsByTagName("div")[0].innerText;
    var db = 0;
    for (var i = 0; i < szoveg.length; i++) {
        if (szoveg[i] == "a") {
            db++;
        }
    }
    return db;
	}

	function osszeadasFeliras(osztaly, x, y) {
    var elso = Number(x);
    var masodik = Number(y);
    var div = document.getElementsByClassName(osztaly)[0];
    var p = document.createElement("p");
    var szoveg = document.createTextNode(elso + " + " + masodik + " = " + (elso + masodik));
    p.appendChild(szoveg);
    div.appendChild(p);
	}
	</script>
	<script src="testBaseUnit.js"></script>
</head>
<body>
    <div></div>
	<hr>
	<div id="testResult">
	<h2>Tesztek</h2></div>
</body>
</html>
